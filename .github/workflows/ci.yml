name: CI

# Blocks merge to main on test failure.
# Runs on every PR and on direct pushes to main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Backend — pytest with moto (no real AWS needed)
  # ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest + moto)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          # Stub all env vars that modules import at load time
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
          DYNAMODB_ASSESSMENT_TABLE: test_oral_assessments
          DYNAMODB_TABLE_NAME: test_chat_sessions
          DYNAMODB_AUTH_USERS_TABLE: test_auth_users
          AUTH_JWT_SECRET: ci-test-secret-32-chars-minimum-xx
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: test
          NEO4J_DATABASE: neo4j
          DEEPGRAM_SECRET_KEY: test
          LOG_FORMAT: text
          LOG_LEVEL: WARNING
        run: |
          PYTHONPATH=. pytest tests/ -q \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=50

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: htmlcov/
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Job 2: Instructor frontend — type-check + lint + Vitest
  # ─────────────────────────────────────────────────────────
  instructor-frontend-test:
    name: Instructor Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: oral-assessment-instructor/package-lock.json

      - name: Install dependencies
        working-directory: oral-assessment-instructor
        # Use the committed lockfile (pins eslint-plugin-react-hooks@7.1.1) so CI lint
        # matches local instead of floating to a newer, stricter plugin. Plain
        # `npm install` (not `npm ci`) keeps npm's auto-add of platform-specific
        # optional deps (e.g. the rollup linux binary), which is why the lockfile was
        # previously deleted.
        run: npm install

      - name: Type check
        working-directory: oral-assessment-instructor
        run: npm run type-check

      - name: Lint
        working-directory: oral-assessment-instructor
        run: npm run lint

      - name: Run Vitest
        working-directory: oral-assessment-instructor
        run: npm run test:run

  # ─────────────────────────────────────────────────────────
  # Job 3: Student frontend — type-check + lint + Vitest
  # ─────────────────────────────────────────────────────────
  student-frontend-test:
    name: Student Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: oral-assessment-student/package-lock.json

      - name: Install dependencies
        working-directory: oral-assessment-student
        # Use the committed lockfile (pins eslint-plugin-react-hooks@7.1.1) so CI lint
        # matches local instead of floating to a newer, stricter plugin. Plain
        # `npm install` (not `npm ci`) keeps npm's auto-add of platform-specific
        # optional deps (e.g. the rollup linux binary), which is why the lockfile was
        # previously deleted.
        run: npm install

      - name: Type check
        working-directory: oral-assessment-student
        run: npm run type-check

      - name: Lint
        working-directory: oral-assessment-student
        run: npm run lint

      - name: Run Vitest
        working-directory: oral-assessment-student
        run: npm run test:run

  # ─────────────────────────────────────────────────────────
  # Job 4: Playwright E2E — full local integration test
  # Runs against mocked API (no real AWS) using page.route()
  # ─────────────────────────────────────────────────────────
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # E2E is the slowest job — run after unit tests pass to save runner minutes
    needs: [backend-test, instructor-frontend-test, student-frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        run: |
          cd oral-assessment-student && rm -f package-lock.json && npm install
          cd ../oral-assessment-instructor && rm -f package-lock.json && npm install

      - name: Run Playwright tests (MOCK_API=true, servers auto-started)
        working-directory: e2e
        env:
          MOCK_API: "true"
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
          DYNAMODB_ASSESSMENT_TABLE: test_oral_assessments
          DYNAMODB_TABLE_NAME: test_chat_sessions
          DYNAMODB_AUTH_USERS_TABLE: test_auth_users
          AUTH_JWT_SECRET: ci-test-secret-32-chars-minimum-xx
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: test
          NEO4J_DATABASE: neo4j
          DEEPGRAM_SECRET_KEY: test
          LOG_FORMAT: text
          LOG_LEVEL: WARNING
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
