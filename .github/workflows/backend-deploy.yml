name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/backend-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.DEPLOY_REGION }}

      - name: Deploy via SSM Run Command
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"

          if [[ -z "${INSTANCE_ID}" ]]; then
            INSTANCE_ID=$(aws ec2 describe-instances \
              --region "${DEPLOY_REGION}" \
              --filters "Name=tag:Name,Values=ai-tutor-app" "Name=instance-state-name,Values=running" \
              --query 'Reservations[0].Instances[0].InstanceId' \
              --output text)
          fi

          if [[ -z "${INSTANCE_ID}" || "${INSTANCE_ID}" == "None" ]]; then
            echo "EC2 instance id not found. Set repository variable EC2_INSTANCE_ID or ensure an instance tagged Name=ai-tutor-app is running in ${DEPLOY_REGION}."
            exit 1
          fi

          echo "Using EC2 instance: ${INSTANCE_ID}"

          COMMAND_ID=$(aws ssm send-command \
            --region "${DEPLOY_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend from GitHub Actions" \
            --parameters commands='[
              "set -e",
              "cd /home/ubuntu/AI-Tutor-Agent",
              "git config --global --add safe.directory /home/ubuntu/AI-Tutor-Agent",
              "EXPECTED_SHA=${{ github.sha }}",
              "echo Expected SHA: $EXPECTED_SHA",
              "git remote set-url origin https://github.com/Matt-odea1/AI-Tutor-Agent.git",
              "echo Git origin URL: $(git remote get-url origin)",
              "git fetch origin main",
              "git reset --hard origin/main",
              "ACTUAL_SHA=$(git rev-parse HEAD)",
              "echo Deployed SHA: $ACTUAL_SHA",
              "[ \"$ACTUAL_SHA\" = \"$EXPECTED_SHA\" ] || { echo \"ERROR: EC2 repo HEAD does not match workflow commit\"; exit 1; }",
              "docker compose build --pull --no-cache api",
              "docker compose up -d --force-recreate --no-deps api",
              "curl -fsS http://localhost:8000/health",
              "curl -fsS http://localhost:8000/openapi.json | grep -q /api/auth/login",
              "curl -fsS http://localhost:8000/openapi.json | grep -q /api/auth/signup",
              "curl -fsS http://localhost:8000/openapi.json | grep -q /api/auth/google"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command id: ${COMMAND_ID}"

          set +e
          aws ssm wait command-executed \
            --region "${DEPLOY_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}"
          WAIT_EXIT=$?
          set -e

          if [[ "${WAIT_EXIT}" -ne 0 ]]; then
            echo "SSM waiter exited non-zero (${WAIT_EXIT}); fetching invocation details..."
          fi

          STATUS=$(aws ssm get-command-invocation \
            --region "${DEPLOY_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'Status' \
            --output text)

          echo "SSM final status: ${STATUS}"

          echo "---- SSM STDOUT ----"
          aws ssm get-command-invocation \
            --region "${DEPLOY_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text || true

          echo "---- SSM STDERR ----"
          aws ssm get-command-invocation \
            --region "${DEPLOY_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'StandardErrorContent' \
            --output text || true

          if [[ "${STATUS}" != "Success" ]]; then
            echo "Backend deploy failed on EC2 (SSM status: ${STATUS})"
            exit 1
          fi
