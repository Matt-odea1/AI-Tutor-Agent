name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/backend-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.DEPLOY_REGION }}

      - name: Deploy via SSM Run Command
        run: |
          set -euo pipefail
          AUTH_JWT_SECRET="${{ secrets[format('AUTH_JWT_SECRET')] }}"
          AUTH_PASSWORD_RESET_BASE_URL="${{ vars[format('AUTH_PASSWORD_RESET_BASE_URL')] }}"
          AUTH_PASSWORD_RESET_FROM_EMAIL="${{ vars[format('AUTH_PASSWORD_RESET_FROM_EMAIL')] }}"
          AUTH_PASSWORD_RESET_TOKEN_MINUTES="${{ vars[format('AUTH_PASSWORD_RESET_TOKEN_MINUTES')] || '30' }}"
          AUTH_PASSWORD_RESET_SES_REGION="${{ vars[format('AUTH_PASSWORD_RESET_SES_REGION')] || env.DEPLOY_REGION }}"

          if [[ -z "${AUTH_JWT_SECRET}" ]]; then
            echo "Missing required GitHub secret: AUTH_JWT_SECRET"
            exit 1
          fi

          if [[ -z "${AUTH_PASSWORD_RESET_BASE_URL}" ]]; then
            echo "Missing required GitHub variable: AUTH_PASSWORD_RESET_BASE_URL"
            exit 1
          fi

          if [[ -z "${AUTH_PASSWORD_RESET_FROM_EMAIL}" ]]; then
            echo "Missing required GitHub variable: AUTH_PASSWORD_RESET_FROM_EMAIL"
            exit 1
          fi

          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"

          if [[ -z "${INSTANCE_ID}" ]]; then
            INSTANCE_ID=$(aws ec2 describe-instances \
              --region "${DEPLOY_REGION}" \
              --filters "Name=tag:Name,Values=ai-tutor-app" "Name=instance-state-name,Values=running" \
              --query 'Reservations[0].Instances[0].InstanceId' \
              --output text)
          fi

          if [[ -z "${INSTANCE_ID}" || "${INSTANCE_ID}" == "None" ]]; then
            echo "EC2 instance id not found. Set repository variable EC2_INSTANCE_ID or ensure an instance tagged Name=ai-tutor-app is running in ${DEPLOY_REGION}."
            exit 1
          fi

          echo "Using EC2 instance: ${INSTANCE_ID}"

          EXPECTED_SHA="${{ github.sha }}"
          REPO_SLUG="${{ github.repository }}"

          PARAMS_FILE=$(mktemp)
          export PARAMS_FILE AUTH_JWT_SECRET AUTH_PASSWORD_RESET_BASE_URL AUTH_PASSWORD_RESET_FROM_EMAIL AUTH_PASSWORD_RESET_TOKEN_MINUTES AUTH_PASSWORD_RESET_SES_REGION EXPECTED_SHA REPO_SLUG

          python - <<'PY'
          import json
          import os
          import shlex

          params_path = os.environ["PARAMS_FILE"]

          auth_jwt_secret = shlex.quote(os.environ["AUTH_JWT_SECRET"])
          reset_base_url = shlex.quote(os.environ["AUTH_PASSWORD_RESET_BASE_URL"])
          reset_from_email = shlex.quote(os.environ["AUTH_PASSWORD_RESET_FROM_EMAIL"])
          reset_token_minutes = shlex.quote(os.environ["AUTH_PASSWORD_RESET_TOKEN_MINUTES"])
          reset_ses_region = shlex.quote(os.environ["AUTH_PASSWORD_RESET_SES_REGION"])
          expected_sha = shlex.quote(os.environ["EXPECTED_SHA"])
          repo_slug = shlex.quote(os.environ["REPO_SLUG"])

          commands = [
              "set -eu",
              "export HOME=/home/ubuntu",
              "cd /home/ubuntu/AI-Tutor-Agent",
              "git config --global --add safe.directory /home/ubuntu/AI-Tutor-Agent",
              "test -f .env || { echo missing_env_file; exit 1; }",
              f"AUTH_JWT_SECRET={auth_jwt_secret}",
              f"AUTH_PASSWORD_RESET_BASE_URL={reset_base_url}",
              f"AUTH_PASSWORD_RESET_FROM_EMAIL={reset_from_email}",
              f"AUTH_PASSWORD_RESET_TOKEN_MINUTES={reset_token_minutes}",
              f"AUTH_PASSWORD_RESET_SES_REGION={reset_ses_region}",
              "if grep -q '^AUTH_JWT_SECRET=' .env; then sed -i \"s|^AUTH_JWT_SECRET=.*|AUTH_JWT_SECRET=$AUTH_JWT_SECRET|\" .env; else echo \"AUTH_JWT_SECRET=$AUTH_JWT_SECRET\" >> .env; fi",
              "if grep -q '^AUTH_PASSWORD_RESET_BASE_URL=' .env; then sed -i \"s|^AUTH_PASSWORD_RESET_BASE_URL=.*|AUTH_PASSWORD_RESET_BASE_URL=$AUTH_PASSWORD_RESET_BASE_URL|\" .env; else echo \"AUTH_PASSWORD_RESET_BASE_URL=$AUTH_PASSWORD_RESET_BASE_URL\" >> .env; fi",
              "if grep -q '^AUTH_PASSWORD_RESET_FROM_EMAIL=' .env; then sed -i \"s|^AUTH_PASSWORD_RESET_FROM_EMAIL=.*|AUTH_PASSWORD_RESET_FROM_EMAIL=$AUTH_PASSWORD_RESET_FROM_EMAIL|\" .env; else echo \"AUTH_PASSWORD_RESET_FROM_EMAIL=$AUTH_PASSWORD_RESET_FROM_EMAIL\" >> .env; fi",
              "if grep -q '^AUTH_PASSWORD_RESET_TOKEN_MINUTES=' .env; then sed -i \"s|^AUTH_PASSWORD_RESET_TOKEN_MINUTES=.*|AUTH_PASSWORD_RESET_TOKEN_MINUTES=$AUTH_PASSWORD_RESET_TOKEN_MINUTES|\" .env; else echo \"AUTH_PASSWORD_RESET_TOKEN_MINUTES=$AUTH_PASSWORD_RESET_TOKEN_MINUTES\" >> .env; fi",
              "if grep -q '^AUTH_PASSWORD_RESET_SES_REGION=' .env; then sed -i \"s|^AUTH_PASSWORD_RESET_SES_REGION=.*|AUTH_PASSWORD_RESET_SES_REGION=$AUTH_PASSWORD_RESET_SES_REGION|\" .env; else echo \"AUTH_PASSWORD_RESET_SES_REGION=$AUTH_PASSWORD_RESET_SES_REGION\" >> .env; fi",
              "JWT_SECRET=$(grep -E '^AUTH_JWT_SECRET=' .env | sed 's/^AUTH_JWT_SECRET=//' | tr -d '\\r')",
              "RESET_BASE_URL=$(grep -E '^AUTH_PASSWORD_RESET_BASE_URL=' .env | sed 's/^AUTH_PASSWORD_RESET_BASE_URL=//' | tr -d '\\r')",
              "RESET_FROM_EMAIL=$(grep -E '^AUTH_PASSWORD_RESET_FROM_EMAIL=' .env | sed 's/^AUTH_PASSWORD_RESET_FROM_EMAIL=//' | tr -d '\\r')",
              "RESET_TOKEN_MINUTES=$(grep -E '^AUTH_PASSWORD_RESET_TOKEN_MINUTES=' .env | sed 's/^AUTH_PASSWORD_RESET_TOKEN_MINUTES=//' | tr -d '\\r')",
              "RESET_SES_REGION=$(grep -E '^AUTH_PASSWORD_RESET_SES_REGION=' .env | sed 's/^AUTH_PASSWORD_RESET_SES_REGION=//' | tr -d '\\r')",
              "if [ -z \"$JWT_SECRET\" ] || [ \"$JWT_SECRET\" = \"replace_with_a_long_random_secret\" ]; then echo missing_or_placeholder_jwt_secret; exit 1; fi",
              "if [ ${#JWT_SECRET} -lt 32 ]; then echo jwt_secret_too_short; exit 1; fi",
              "if [ -z \"$RESET_BASE_URL\" ]; then echo missing_reset_base_url; exit 1; fi",
              "case \"$RESET_BASE_URL\" in http://*|https://*) ;; *) echo invalid_reset_base_url; exit 1 ;; esac",
              "if [ -z \"$RESET_FROM_EMAIL\" ]; then echo missing_reset_from_email; exit 1; fi",
              "echo \"$RESET_FROM_EMAIL\" | grep -Eq '^[^@[:space:]]+@[^@[:space:]]+\\.[^@[:space:]]+$' || { echo invalid_reset_from_email; exit 1; }",
              "echo \"$RESET_TOKEN_MINUTES\" | grep -Eq '^[0-9]+$' || { echo invalid_reset_token_minutes; exit 1; }",
              "if [ \"$RESET_TOKEN_MINUTES\" -lt 5 ] || [ \"$RESET_TOKEN_MINUTES\" -gt 180 ]; then echo reset_token_minutes_out_of_range; exit 1; fi",
              "if [ -z \"$RESET_SES_REGION\" ]; then echo missing_reset_ses_region; exit 1; fi",
              f"EXPECTED_SHA={expected_sha}",
              "echo Expected SHA: $EXPECTED_SHA",
              f"REPO_SLUG={repo_slug}",
              "git remote set-url origin https://github.com/$REPO_SLUG.git",
              "echo Git origin URL: $(git remote get-url origin)",
              "git fetch origin main",
              "git reset --hard origin/main",
              "ACTUAL_SHA=$(git rev-parse HEAD)",
              "echo Deployed SHA: $ACTUAL_SHA",
              "[ \"$ACTUAL_SHA\" = \"$EXPECTED_SHA\" ] || { echo \"ERROR: EC2 repo HEAD does not match workflow commit\"; exit 1; }",
              "docker compose build --pull --no-cache api",
              "docker compose up -d --force-recreate --no-deps api",
              "for i in $(seq 1 45); do if curl -fsS http://localhost:8000/health >/dev/null; then echo health_ok; break; fi; echo waiting_for_health_$i; sleep 2; done",
              "curl -fsS http://localhost:8000/health >/dev/null || { echo health_check_failed; docker compose ps; docker logs --tail 200 ai-tutor-api || true; exit 1; }",
              "for i in $(seq 1 30); do if curl -fsS http://localhost:8000/openapi.json >/dev/null; then echo openapi_ok; break; fi; echo waiting_for_openapi_$i; sleep 2; done",
              "curl -fsS http://localhost:8000/openapi.json >/tmp/openapi.json || { echo openapi_fetch_failed; docker compose ps; docker logs --tail 200 ai-tutor-api || true; exit 1; }",
              "grep -q /api/auth/login /tmp/openapi.json || { echo missing_auth_login_route; docker compose ps; docker logs --tail 200 ai-tutor-api || true; exit 1; }",
              "grep -q /api/auth/signup /tmp/openapi.json || { echo missing_auth_signup_route; docker compose ps; docker logs --tail 200 ai-tutor-api || true; exit 1; }",
              "grep -q /api/auth/google /tmp/openapi.json || { echo missing_auth_google_route; docker compose ps; docker logs --tail 200 ai-tutor-api || true; exit 1; }",
          ]

          with open(params_path, "w", encoding="utf-8") as handle:
              json.dump({"commands": commands}, handle)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --region "${DEPLOY_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend from GitHub Actions" \
            --timeout-seconds 5400 \
            --parameters "file://${PARAMS_FILE}" \
            --query 'Command.CommandId' \
            --output text)

          rm -f "${PARAMS_FILE}"

          echo "SSM command id: ${COMMAND_ID}"

          POLL_INTERVAL=20
          MAX_WAIT_SECONDS=5400
          ELAPSED=0
          STATUS="Pending"

          while true; do
            set +e
            STATUS=$(aws ssm get-command-invocation \
              --region "${DEPLOY_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null)
            STATUS_EXIT=$?
            set -e

            if [[ "${STATUS_EXIT}" -ne 0 || -z "${STATUS}" || "${STATUS}" == "None" ]]; then
              STATUS="Pending"
            fi

            echo "SSM status after ${ELAPSED}s: ${STATUS}"

            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
              Pending|InProgress|Delayed)
                ;;
              *)
                echo "Unknown SSM status '${STATUS}', continuing to poll"
                ;;
            esac

            if (( ELAPSED >= MAX_WAIT_SECONDS )); then
              echo "SSM command exceeded max wait (${MAX_WAIT_SECONDS}s)"
              STATUS="TimedOut"
              break
            fi

            sleep "${POLL_INTERVAL}"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          echo "SSM final status: ${STATUS}"

          echo "---- SSM METADATA ----"
          aws ssm get-command-invocation \
            --region "${DEPLOY_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,ExecutionStartDateTime:ExecutionStartDateTime,ExecutionEndDateTime:ExecutionEndDateTime,ExecutionElapsedTime:ExecutionElapsedTime}' \
            --output json || true

          echo "---- SSM STDOUT ----"
          aws ssm get-command-invocation \
            --region "${DEPLOY_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text || true

          echo "---- SSM STDERR ----"
          aws ssm get-command-invocation \
            --region "${DEPLOY_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'StandardErrorContent' \
            --output text || true

          if [[ "${STATUS}" != "Success" ]]; then
            echo "Backend deploy failed on EC2 (SSM status: ${STATUS})"
            exit 1
          fi
