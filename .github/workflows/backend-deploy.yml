name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "src/**"
      - "requirements.txt"
      - "scripts/load-ssm-env.sh"
      - ".github/workflows/backend-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

    # OIDC: request id-token permission to get a short-lived AWS credential
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.DEPLOY_REGION }}

      # Resolve the target and check it is actually running BEFORE trying to
      # deploy. EC2_INSTANCE_ID pins a specific instance, which bypasses the
      # running-state filter in the tag lookup below — so a stopped instance
      # (e.g. while AWS spend is paused) reached SendCommand and failed the
      # workflow with "InvalidInstanceId: Instances not in a valid state".
      # A powered-off target is not a broken build: skip, loudly.
      - name: Resolve target EC2 instance
        id: target
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"

          if [[ -z "${INSTANCE_ID}" ]]; then
            INSTANCE_ID=$(aws ec2 describe-instances \
              --region "${DEPLOY_REGION}" \
              --filters "Name=tag:Name,Values=ai-tutor-app" "Name=instance-state-name,Values=running" \
              --query 'Reservations[0].Instances[0].InstanceId' \
              --output text)
          fi

          if [[ -z "${INSTANCE_ID}" || "${INSTANCE_ID}" == "None" ]]; then
            echo "EC2 instance not found. Set EC2_INSTANCE_ID variable or tag the instance Name=ai-tutor-app."
            exit 1
          fi

          STATE=$(aws ec2 describe-instances \
            --region "${DEPLOY_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text 2>/dev/null || echo "unknown")

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"

          if [[ "${STATE}" != "running" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend deploy skipped::Instance ${INSTANCE_ID} is '${STATE}', not 'running'. Start it and re-run this workflow to deploy ${{ github.sha }}."
            echo "### Backend deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Instance \`${INSTANCE_ID}\` is **${STATE}**, not \`running\` — nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
            echo "Start the instance and re-run this workflow to deploy \`${{ github.sha }}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "Using EC2 instance: ${INSTANCE_ID} (${STATE})"

      - name: Deploy via SSM Run Command
        if: steps.target.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ steps.target.outputs.instance_id }}"

          EXPECTED_SHA="${{ github.sha }}"
          REPO_SLUG="${{ github.repository }}"

          PARAMS_FILE=$(mktemp)
          export PARAMS_FILE EXPECTED_SHA REPO_SLUG

          python3 - <<'PY'
          import json, os, shlex

          params_path  = os.environ["PARAMS_FILE"]
          expected_sha = shlex.quote(os.environ["EXPECTED_SHA"])
          repo_slug    = shlex.quote(os.environ["REPO_SLUG"])

          commands = [
              "set -eu",
              "export HOME=/home/ubuntu",
              # Ensure boto3 is present — required by load-ssm-env.sh (no AWS CLI needed)
              "pip3 install boto3 --quiet --disable-pip-version-check 2>/dev/null || true",
              "cd /home/ubuntu/AI-Tutor-Agent",
              "git config --global --add safe.directory /home/ubuntu/AI-Tutor-Agent",
              # Assign to shell variables first so shlex.quote'd values work correctly
              f"EXPECTED_SHA={expected_sha}",
              f"REPO_SLUG={repo_slug}",
              "git remote set-url origin https://github.com/$REPO_SLUG.git",
              "git fetch origin main",
              "git reset --hard origin/main",
              "ACTUAL_SHA=$(git rev-parse HEAD)",
              "echo Deploying SHA: $ACTUAL_SHA",
              "[ \"$ACTUAL_SHA\" = \"$EXPECTED_SHA\" ] || { echo \"sha_mismatch: expected $EXPECTED_SHA got $ACTUAL_SHA\"; exit 1; }",
              # Reload .env from SSM — picks up any secret changes too
              "./scripts/load-ssm-env.sh",
              "docker compose build --pull --no-cache api",
              "docker compose up -d --force-recreate --no-deps api",
              # Health check — wait up to 90 s
              "for i in $(seq 1 45); do if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then echo health_ok; break; fi; echo \"waiting_for_health_$i\"; sleep 2; done",
              "curl -fsS http://localhost:8000/health >/dev/null || { echo health_check_failed; docker compose ps; docker logs --tail 200 ai-tutor-api || true; exit 1; }",
              # Verify key routes are present
              "curl -fsS http://localhost:8000/openapi.json >/tmp/openapi.json || { echo openapi_fetch_failed; exit 1; }",
              "grep -q /api/auth/login /tmp/openapi.json || { echo missing_auth_login_route; exit 1; }",
          ]

          with open(params_path, "w") as f:
              json.dump({"commands": commands}, f)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --region "${DEPLOY_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend from GitHub Actions ${EXPECTED_SHA:0:8}" \
            --timeout-seconds 5400 \
            --parameters "file://${PARAMS_FILE}" \
            --query 'Command.CommandId' \
            --output text)

          rm -f "${PARAMS_FILE}"

          echo "SSM command id: ${COMMAND_ID}"

          POLL_INTERVAL=20
          MAX_WAIT_SECONDS=5400
          ELAPSED=0
          STATUS="Pending"

          while true; do
            set +e
            STATUS=$(aws ssm get-command-invocation \
              --region "${DEPLOY_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null)
            STATUS_EXIT=$?
            set -e

            if [[ "${STATUS_EXIT}" -ne 0 || -z "${STATUS}" || "${STATUS}" == "None" ]]; then
              STATUS="Pending"
            fi

            echo "SSM status after ${ELAPSED}s: ${STATUS}"

            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
              Pending|InProgress|Delayed) ;;
              *) echo "Unknown SSM status '${STATUS}', continuing to poll" ;;
            esac

            if (( ELAPSED >= MAX_WAIT_SECONDS )); then
              echo "SSM command exceeded max wait (${MAX_WAIT_SECONDS}s)"
              STATUS="TimedOut"
              break
            fi

            sleep "${POLL_INTERVAL}"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          echo "---- SSM METADATA ----"
          aws ssm get-command-invocation \
            --region "${DEPLOY_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,ExecutionElapsedTime:ExecutionElapsedTime}' \
            --output json || true

          echo "---- SSM STDOUT ----"
          aws ssm get-command-invocation \
            --region "${DEPLOY_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text || true

          echo "---- SSM STDERR ----"
          aws ssm get-command-invocation \
            --region "${DEPLOY_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'StandardErrorContent' \
            --output text || true

          if [[ "${STATUS}" != "Success" ]]; then
            echo "Backend deploy failed (SSM status: ${STATUS})"
            exit 1
          fi
